backend:
  name: github
  repo: Hobrobro/apt-works-website
  branch: main
  base_url: https://apt-works-cms-oauth.vercel.app
publish_mode: editorial_workflow
media_folder: "blog/images"
public_folder: "/blog/images"

collections:
  - name: "blog"
    label: "部落格文章"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "發布日期", name: "date", widget: "datetime"}
      - {label: "摘要", name: "excerpt", widget: "text"}
      - {label: "封面圖片", name: "thumbnail", widget: "image", required: false}
      - label: "分類"
        name: "category"
        widget: "select"
        options:
          - 製造業
          - 流程優化
          - AI導入
          - 系統規劃
          - 知識管理
          - 數位轉型
          - 案例分享
      - {label: "內文", name: "body", widget: "markdown"}
